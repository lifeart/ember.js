<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ember.js — gxt native, full compat population</title>
  </head>
  <body>
    <!--
      Gauge page for "compat = native layer + legacy add-on" (W4 §4, E0): the
      FULL compat test population (the same four globs as index.html) on the
      gxt NATIVE build, with no allow-list (native-modules.json) and no skips
      (native-skip.json). Serve the native build with
        EMBER_RENDER_BACKEND=gxt-native npx vite --port 5181 --strictPort --force
      and run
        node scripts/gxt-test-runner/runner.mjs --url http://localhost:5181/native-legacy.html --full --min-modules 1
      A test file that cannot load on native (a missing export, a VM package the
      native aliases do not serve, a throw at module evaluation) is reported as
      its own failing module `native-legacy.html: load <path>` carrying the
      error, so one bad file never takes the page down.
      `window.__nativeLegacy` exposes `loadErrors` (path -> error) and
      `moduleFiles` (QUnit module name -> test file), and `settled` once every
      file settled; scripts/gxt-test-runner/native-legacy-inventory.mjs dumps
      them for classification.
    -->
    <script type="module">
      // gxt lowers decorators in .gjs/.gts to the `dt7948` globals.
      import 'decorator-transforms/globals';
    </script>
    <script type="module">
      import 'qunit/qunit/qunit.js';
      import 'qunit/qunit/qunit.css';

      // Modules are imported asynchronously below; start once all registered.
      QUnit.config.autostart = false;
      QUnit.config.testTimeout = 10000;

      // Same environment as native.html (the native layer follows classic).
      window.EmberENV = {
        _DEFAULT_ASYNC_OBSERVERS: true,
        RAISE_ON_DEPRECATION: QUnit.urlParams.RAISE_ON_DEPRECATION
          ? QUnit.urlParams.RAISE_ON_DEPRECATION === 'true'
          : true,
      };
      if (QUnit.urlParams.ENABLE_OPTIONAL_FEATURES) {
        EmberENV.ENABLE_OPTIONAL_FEATURES = true;
      }
      if (QUnit.urlParams.ALL_DEPRECATIONS_ENABLED) {
        EmberENV['_ALL_DEPRECATIONS_ENABLED'] = true;
      }
      if (QUnit.urlParams.OVERRIDE_DEPRECATION_VERSION) {
        EmberENV['_OVERRIDE_DEPRECATION_VERSION'] = QUnit.urlParams.OVERRIDE_DEPRECATION_VERSION;
      }
    </script>
    <script type="module">
      import setupQUnit from './packages/internal-test-helpers/lib/ember-dev/setup-qunit.ts';
      import { setTesting } from './packages/@ember/debug/index.ts';

      // The compat page's population (index.html), loaded lazily so that each
      // file can fail on its own.
      const modules = import.meta.glob([
        './packages/@ember/-internals/*/tests/**/*.{js,ts,gjs,gts}',
        './packages/*/*/tests/**/*.{js,ts,gjs,gts}',
        './packages/*/tests/**/*.{js,ts,gjs,gts}',
        './packages/{@glimmer,@glimmer-workspace}/*/test/**/*-test.{js,ts,gjs,gts}',
        '!./packages/demo/src/tests/**',
      ]);
      // The demo suite (`Compat: validator.ts`, `GXT Integration`, ...) tests
      // the compat bridge itself: it imports gxt-backend/compile.ts through
      // ember-template-compiler.ts, whose global patches would contaminate the
      // whole native page. Never evaluated here; each file is reported as not
      // loadable. (Lazy glob: only the keys are read.)
      const compatBridgeSuites = import.meta.glob('./packages/demo/src/tests/**/*.{js,ts,gjs,gts}');
      const COMPAT_BRIDGE_REASON =
        'not loaded on native: a compat-bridge suite (imports gxt-backend/compile.ts via ' +
        'gxt-backend/ember-template-compiler.ts; registered only by the gxt compat build)';

      setupQUnit();
      setTesting(true);

      // QUnit module name -> the test file that registered it (the first
      // test-tree frame of the registering call), for the red-list buckets.
      const TEST_FILE = /\/packages\/[^\s?:)]*\/(?:tests?|__tests__)\/[^\s?:)]*/;
      const moduleFiles = Object.create(null);
      const loadErrors = Object.create(null);
      window.__nativeLegacy = { moduleFiles, loadErrors };
      const originalModule = QUnit.module;
      const recordingModule = function (...args) {
        const match = TEST_FILE.exec(new Error().stack || '');
        const before = QUnit.config.modules.length;
        const result = originalModule.apply(this, args);
        const registered = QUnit.config.modules;
        for (let i = before; i < registered.length; i++) {
          const name = registered[i].name;
          if (!(name in moduleFiles)) moduleFiles[name] = match ? match[0] : null;
        }
        return result;
      };
      Object.assign(recordingModule, originalModule);
      QUnit.module = recordingModule;

      // Test files whose import has not settled yet (a hang diagnostic).
      const pending = new Set();
      window.__nativeLegacy.pending = pending;
      const paths = Object.keys(modules).sort();
      const results = await Promise.allSettled(
        paths.map((path) => {
          pending.add(path);
          return modules[path]().finally(() => pending.delete(path));
        })
      );
      const reportUnloadable = (path, message) => {
        loadErrors[path] = message;
        originalModule(`native-legacy.html: load ${path}`);
        QUnit.test('module loads', (assert) => {
          assert.ok(false, message);
        });
      };
      results.forEach((result, i) => {
        if (result.status === 'rejected') {
          const reason = result.reason;
          console.error(`[native-legacy.html] failed to load ${paths[i]}`, reason);
          reportUnloadable(
            paths[i],
            String((reason && (reason.stack || reason.message)) || reason)
          );
        }
      });
      for (const path of Object.keys(compatBridgeSuites).sort()) {
        reportUnloadable(path, COMPAT_BRIDGE_REASON);
      }
      window.__nativeLegacy.settled = true;
      QUnit.start();
    </script>

    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
  </body>
</html>
